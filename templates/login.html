{% extends "base.html" %}{% block title %}Log in{% endblock %}
{% block content %}
<div class="auth card">
  <h1>🐄 Gaushala</h1>
  <p class="muted">Cattle management and dairy shop</p>
  <form method="post" class="stack">
    <input type="hidden" name="csrf" value="{{ csrf_token }}">
    <label class="full">Username <input name="username" required autofocus></label>
    <label class="full">Password <input name="password" type="password" required></label>
    <div class="full"><button>Log in</button></div>
  </form>
  <p class="small">New customer? <a href="{{ url_for('register') }}">Create an account</a> to order dairy products.</p>
</div>
{% endblock %}
