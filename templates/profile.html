{% extends "base.html" %}{% block title %}{{ _('My profile') }}{% endblock %}
{% block content %}
<h1>{{ _('My profile') }}</h1>
<div class="card">
<form method="post" class="stack">
  <input type="hidden" name="csrf" value="{{ csrf_token }}">
  <label>{{ _('Username') }} <input value="{{ user.username }}" disabled></label>
  <label>{{ _('Role') }} <input value="{{ _(user.role|title) }}" disabled></label>
  <label>{{ _('Full name') }} <input name="full_name" value="{{ user.full_name }}" required></label>
  <label>{{ _('Phone') }} <input name="phone" value="{{ user.phone or '' }}"></label>
  <label>{{ _('Email') }} <input name="email" type="email" value="{{ user.email or '' }}"></label>
  <label class="full">{{ _('Address') }} <textarea name="address">{{ user.address or '' }}</textarea></label>
  <h2 class="full" style="margin-top:8px">{{ _('Change password') }}</h2>
  <label>{{ _('Current password') }} <input name="old_password" type="password"></label>
  <label>{{ _('New password') }} <input name="new_password" type="password" minlength="6"></label>
  <div class="full actions"><button>{{ _('Save') }}</button></div>
</form>
</div>
{% endblock %}
