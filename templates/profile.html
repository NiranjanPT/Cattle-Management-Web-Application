{% extends "base.html" %}{% block title %}My profile{% endblock %}
{% block content %}
<h1>My profile</h1>
<div class="card">
<form method="post" class="stack">
  <input type="hidden" name="csrf" value="{{ csrf_token }}">
  <label>Username <input value="{{ user.username }}" disabled></label>
  <label>Role <input value="{{ user.role|title }}" disabled></label>
  <label>Full name <input name="full_name" value="{{ user.full_name }}" required></label>
  <label>Phone <input name="phone" value="{{ user.phone or '' }}"></label>
  <label>Email <input name="email" type="email" value="{{ user.email or '' }}"></label>
  <label class="full">Address <textarea name="address">{{ user.address or '' }}</textarea></label>
  <h2 class="full" style="margin-top:8px">Change password</h2>
  <label>Current password <input name="old_password" type="password"></label>
  <label>New password <input name="new_password" type="password" minlength="6"></label>
  <div class="full"><button>Save</button></div>
</form>
</div>
{% endblock %}
