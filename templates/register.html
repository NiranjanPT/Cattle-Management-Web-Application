{% extends "base.html" %}{% block title %}{{ _('Create account') }}{% endblock %}
{% block content %}
<div class="auth card" style="max-width:560px">
  <h1>{{ _('Create a customer account') }}</h1>
  <form method="post" class="stack">
    <input type="hidden" name="csrf" value="{{ csrf_token }}">
    <label>{{ _('Full name') }} <input name="full_name" required></label>
    <label>{{ _('Username') }} <input name="username" required></label>
    <label>{{ _('Password') }} <input name="password" type="password" minlength="6" required></label>
    <label>{{ _('Phone') }} <input name="phone"></label>
    <label class="full">{{ _('Email') }} <input name="email" type="email"></label>
    <label class="full">{{ _('Delivery address') }} <textarea name="address"></textarea></label>
    <div class="full actions"><button>{{ _('Create account') }}</button> <a class="btn ghost" href="{{ url_for('login') }}">{{ _('Back to log in') }}</a></div>
  </form>
</div>
{% endblock %}
