{% extends "base.html" %}{% block title %}{{ _('Create account') }}{% endblock %}
{% block content %}
<div class="auth card" style="max-width:640px">
  <h1>{{ _('Create a customer account') }}</h1>
  {# a problem keeps what was typed (not the password) #}
  <form method="post" class="stack">
    <input type="hidden" name="csrf" value="{{ csrf_token }}">
    <label>{{ _('Full name') }} * <input name="full_name" value="{{ form.full_name }}" autocomplete="name" required></label>
    <label>{{ _('Username') }} * <input name="username" value="{{ form.username }}" autocomplete="username" required></label>
    <label>{{ _('Password') }} * <input name="password" type="password" minlength="6" autocomplete="new-password" required></label>
    <label>{{ _('Phone') }} <input name="phone" type="tel" inputmode="tel" value="{{ form.phone }}" autocomplete="tel"></label>
    <label class="full">{{ _('Email') }} <input name="email" type="email" value="{{ form.email }}" autocomplete="email"></label>
    {% include "_address_fields.html" %}
    <div class="full actions"><button>{{ _('Create account') }}</button> <a class="btn ghost" href="{{ url_for('login') }}">{{ _('Back to log in') }}</a></div>
  </form>
</div>
{% endblock %}
