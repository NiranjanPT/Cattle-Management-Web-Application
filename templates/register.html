{% extends "base.html" %}{% block title %}Create account{% endblock %}
{% block content %}
<div class="auth card" style="max-width:520px">
  <h1>Create a customer account</h1>
  <form method="post" class="stack">
    <input type="hidden" name="csrf" value="{{ csrf_token }}">
    <label>Full name <input name="full_name" required></label>
    <label>Username <input name="username" required></label>
    <label>Password <input name="password" type="password" minlength="6" required></label>
    <label>Phone <input name="phone"></label>
    <label class="full">Email <input name="email" type="email"></label>
    <label class="full">Delivery address <textarea name="address"></textarea></label>
    <div class="full"><button>Create account</button> <a href="{{ url_for('login') }}">Back to log in</a></div>
  </form>
</div>
{% endblock %}
